name: Main Foodgram workflow

on: push

jobs:

  backend_tests_flake8:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3
      - name: Set up Python '3.13'
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install flake8==7.3.0
#          pip install flake8==7.3.0 flake8-isort
      - name: Test with flake8
        run: |
          python -m flake8 backend/

#  frontend_tests:
#    runs-on: ubuntu-latest
#
#    steps:
#    - uses: actions/checkout@v3
#    - name: Set up nodeJS
#      uses: actions/setup-node@v3
#      with:
#        node-version: 18
#
#    - name: Install dependencies
#      run: |
#        cd frontend/
#        npm ci
#    - name: Test frontend
#      run: |
#        cd frontend/
#        npm run test

  build_backend_and_push_to_docker_hub:
    name: Push backend Docker image to DockerHub
    runs-on: ubuntu-latest
    needs: backend_tests_flake8
    if: github.ref_name == 'main'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./backend/
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/foodgram-back:latest
            ${{ secrets.DOCKER_USERNAME }}/foodgram-back:${{ github.sha }}

  build_frontend_and_push_to_docker_hub:
    name: Push frontend Docker image to DockerHub
    runs-on: ubuntu-latest
#    needs: frontend_tests
    if: github.ref_name == 'main'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./frontend/
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/foodgram-front:latest
            ${{ secrets.DOCKER_USERNAME }}/foodgram-front:${{ github.sha }}

  build_proxy_and_push_to_docker_hub:
    name: Push proxy Docker image to DockerHub
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./infra/
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/foodgram-proxy:latest
            ${{ secrets.DOCKER_USERNAME }}/foodgram-proxy:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build_backend_and_push_to_docker_hub
      - build_frontend_and_push_to_docker_hub
      - build_proxy_and_push_to_docker_hub
    if: github.ref_name == 'main'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Copy files via ssh
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml, data/"
          target: "foodgram"
      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd foodgram
            sudo docker compose -f docker-compose.yml pull
            sudo docker compose -f docker-compose.yml down
            sudo docker compose -f docker-compose.yml up -d
            sudo docker compose -f docker-compose.yml exec backend python manage.py migrate
            sudo docker compose -f docker-compose.yml exec backend python manage.py collectstatic
            sudo docker compose -f docker-compose.yml exec backend cp -r /app/collected_static/. /static/static/
            sudo docker compose -f docker-compose.yml exec backend python manage.py load_csv

  send_message:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref_name == 'main'
    steps:
    - name: Send message
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: | 
          Деплой проекта Foodgram успешно выполнен!
          Пользователь: ${{ github.actor }}
          Сообщение: ${{ github.event.commits[0].message || 'без сообщения.'}}
