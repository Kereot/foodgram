volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
  backend:
    image: kereot/foodgram-back
    env_file: .env
    volumes:
      - static:/static
      - media:/app/media
      - ./data:/app/data/
    depends_on:
      - db
  frontend:
#    container_name: foodgram-front
#    build: ../frontend
#    volumes:
#      - ../frontend/:/app/result_build/
    env_file: .env
    image: kereot/foodgram-front
    command: cp -r /app/build/. /static/
    volumes:
      - static:/static
  nginx:
#    container_name: foodgram-proxy
#    image: nginx:1.25.4-alpine
#    ports:
#      - "80:80"
#    volumes:
#      - ./nginx.conf:/etc/nginx/conf.d/default.conf
#      - ../frontend/build:/usr/share/nginx/html/
#      - ../docs/:/usr/share/nginx/html/api/docs/
    image: kereot/foodgram-proxy
    env_file: .env
    ports:
      - 10000:80
    volumes:
      - static:/static
      - media:/app/media
    depends_on:
      - backend
      - frontend
